name: Boot Aluminium OS ARM64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct download URL to your .img file (Google Drive, Dropbox, etc)'
        required: true
        type: string

jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-aarch64 qemu-utils novnc websockify wget curl xvfb x11vnc tigervnc-standalone-server

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq
          sudo apt-get install -y ngrok

      - name: Download Aluminium OS .img
        run: |
          echo "Downloading image from provided URL..."
          wget -q --show-progress -O aluminium-os.img "${{ github.event.inputs.image_url }}"
          echo "Download complete! File size:"
          ls -lh aluminium-os.img

      - name: Start noVNC + QEMU
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          # Start a virtual display
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # Start VNC server on port 5900
          x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -forever &
          sleep 2

          # Start noVNC websocket proxy on port 6080
          websockify --web /usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

          # Start ngrok tunnel to port 6080
          ngrok http 6080 --log=stdout &
          sleep 5

          # Print the ngrok URL
          echo "========================================="
          echo "YOUR BROWSER URL IS BELOW:"
          curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'])"
          echo "Open the URL above in your browser!"
          echo "========================================="

          # Boot Aluminium OS in QEMU
          qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a57 \
            -smp 4 \
            -m 6G \
            -drive file=aluminium-os.img,format=raw,if=virtio \
            -device virtio-gpu \
            -device usb-ehci \
            -device usb-kbd \
            -device usb-mouse \
            -display sdl \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.bin \
            -serial stdio || true
