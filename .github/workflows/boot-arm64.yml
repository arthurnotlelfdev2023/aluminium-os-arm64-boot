name: Boot LineageOS VirtIO ARM64 (macOS HVF + Tailscale)

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: 'Link direto para uma GSI (Generic System Image) opcional'
        required: false
        type: string
        default: ''

jobs:
  boot:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install qemu wget curl jq unzip novnc
          pip3 install websockify


      - name: Download default images (if no GSI provided)
        if: ${{ inputs.gsi_url == '' }}
        run: |
          wget -O system.img "https://drive.google.com/uc?id=1PGYGqOcOsGB_vQgEdJP4eU83330TQ9oc&export=download"
          wget -O vendor.img "https://drive.google.com/uc?id=1G-IXUpp_40kUl7lCE1HP0Qsy0kB2qkJP&export=download"

      - name: Download provided GSI
        if: ${{ inputs.gsi_url != '' }}
        run: |
          curl -L "${{ inputs.gsi_url }}" -o system.img

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Boot LineageOS with QEMU
        run: |
          qemu-system-aarch64 \
            -machine virt,accel=hvf \
            -cpu cortex-a72 \
            -m 4096 \
            -smp 4 \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp::5555-:5555 \
            -drive if=none,file=system.img,format=raw,id=system \
            -device virtio-blk-pci,drive=system \
            -drive if=none,file=vendor.img,format=raw,id=vendor \
            -device virtio-blk-pci,drive=vendor \
            -nographic
