name: Boot Aluminium OS ARM64

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct download URL to your .img file'
        required: true
        type: string

jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-aarch64 qemu-utils qemu-efi-aarch64 ovmf novnc websockify wget curl android-sdk-libsparse-utils

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq
          sudo apt-get install -y ngrok

      - name: Download Aluminium OS .img
        run: |
          wget -q --show-progress -O aluminium-os-original.img "${{ github.event.inputs.image_url }}"
          ls -lh aluminium-os-original.img

      - name: Convert sparse image to raw
        run: |
          echo "Checking image type..."
          file aluminium-os-original.img
          # Try simg2img conversion (handles sparse Android images)
          if simg2img aluminium-os-original.img aluminium-os.img 2>/dev/null; then
            echo "Converted sparse image to raw successfully!"
          else
            echo "Not a sparse image, using as-is"
            cp aluminium-os-original.img aluminium-os.img
          fi
          echo "Final image info:"
          file aluminium-os.img
          ls -lh aluminium-os.img
          # Show partition table
          fdisk -l aluminium-os.img || true
          sgdisk -p aluminium-os.img || true

      - name: Start noVNC + QEMU
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          # Find BIOS
          BIOS=$(find /usr -name "QEMU_EFI.fd" 2>/dev/null | head -1)
          if [ -z "$BIOS" ]; then
            BIOS=$(find /usr/share/qemu-efi-aarch64/ -type f 2>/dev/null | head -1)
          fi
          echo "Using BIOS: $BIOS"

          # noVNC proxying QEMU VNC port 5901
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &
          sleep 2

          # Start ngrok
          ngrok http 6080 --log=stdout &
          sleep 6

          # Print URL with direct /vnc.html path
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'])")
          echo "========================================="
          echo "OPEN THIS EXACT URL IN YOUR BROWSER:"
          echo "$NGROK_URL/vnc.html?autoconnect=true&resize=scale"
          echo "========================================="

          # Boot QEMU
          qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a57 \
            -smp 4 \
            -m 6G \
            -drive file=aluminium-os.img,format=raw,if=virtio,id=hd0 \
            -device virtio-gpu,xres=1280,yres=720 \
            -device usb-ehci \
            -device usb-kbd \
            -device usb-mouse \
            -display vnc=:1 \
            -bios $BIOS \
            -boot order=c,menu=off \
            -serial stdio
